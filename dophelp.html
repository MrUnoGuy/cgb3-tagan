<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лекция по ПМП | ЦГБ№3</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #f4f6f8; 
            color: #1f2933; 
            line-height: 1.6; 
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 { 
            color: #16a34a; /* Зеленый цвет для ПМП */
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 10px; 
            margin-bottom: 30px;
        }
        h2 { 
            color: #15803d; 
            margin-top: 30px; 
            font-size: 20px;
            background: #f0fdf4; /* Светло-зеленый фон */
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 4px solid #16a34a;
        }
        h3 { 
            color: #334155; 
            margin-top: 20px; 
            font-size: 18px; 
        }
        p { margin-bottom: 15px; }
        ul { margin-bottom: 15px; padding-left: 20px; }
        li { margin-bottom: 8px; }
        
        /* Блок для важных предупреждений (красный) */
        .alert {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .alert strong { color: #b91c1c; }

        /* Кнопка "Назад" */
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #16a34a;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-back:hover { text-decoration: underline; }

        /* Оглавление */
        .toc {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }
        .toc ul { list-style-type: none; padding-left: 0; }
        .toc li { margin-bottom: 5px; }
        .toc a { color: #16a34a; text-decoration: none; }
        .toc a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-back">← Вернуться на главную</a>

  <h1>Дополнительная помощь</h1>
